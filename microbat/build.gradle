plugins {
    id "java"
    id "eclipse"
    id "io.freefair.lombok" version "8.13"
}

repositories {
    mavenCentral()
}

def extraLibDir = file("$buildDir/extra_lib")

sourceSets {
    main {
        java {
            srcDirs += 'src/main'
            srcDirs += 'src/evaluation'
            srcDirs += 'src/behavior'
            srcDirs += "src/test"
        }
        resources {
            srcDirs += 'resources'
            srcDirs += extraLibDir
        }
    }
}

task createExtraLibDir {
    doLast {
        extraLibDir.mkdirs()
    }
}

task copyInstrumentatorJar {
    doLast {
        copy {
            from project(':microbat:microbat_instrumentator').tasks.findByName('shadowJar').outputs.files.singleFile
            into extraLibDir
            rename { fileName ->
                "microbat_instrumentator.jar"
            }
        }
        copy {
            from project(':debugging-package-jar').tasks.findByName('shadowJar').outputs.files.singleFile
            into extraLibDir
            rename { fileName ->
                "packages.jar"
            }
        }
    }
}
processResources.dependsOn(copyInstrumentatorJar)
copyInstrumentatorJar.dependsOn(':microbat:microbat_instrumentator:shadowJar')
copyInstrumentatorJar.dependsOn(':debugging-package-jar:shadowJar')
copyInstrumentatorJar.dependsOn(createExtraLibDir)

task copyTestRunnerJar {
    doLast {
        copy {
            from project(':microbat:microbat_test_runner').tasks.findByName('shadowJar').outputs.files.singleFile
            into extraLibDir
            rename { fileName ->
                "microbat_test_runner.jar"
            }
        }
    }
}
processResources.dependsOn(copyTestRunnerJar)
copyTestRunnerJar.dependsOn(':microbat:microbat_test_runner:shadowJar')
copyTestRunnerJar.dependsOn(createExtraLibDir)

dependencies {
    implementation 'org.apache.bcel:bcel:6.0'
    implementation 'org.benf:cfr:0.152'
    implementation 'com.ibm.wala:com.ibm.wala.core:1.3.9'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.github.javaparser:javaparser-core:3.26.2'
    implementation 'com.github.javaparser:javaparser-symbol-solver-core:3.26.2'
    implementation 'org.jgrapht:jgrapht-core:1.5.2'
    implementation 'org.jgrapht:jgrapht-io:1.5.2'
    implementation 'org.json:json:20220924'
    implementation 'org.apache.poi:poi:3.11'
    implementation 'org.apache.poi:poi-ooxml:3.11'
    implementation 'org.apache.poi:poi-ooxml-schemas:3.11'
    implementation 'org.xerial:sqlite-jdbc:3.32.3.2'
    implementation 'mysql:mysql-connector-java:5.1.44'
    implementation 'org.scala-sbt.ipcsocket:ipcsocket:1.6.3'

    compileOnly 'org.eclipse.jdt:org.eclipse.jdt.core:3.40.0'
    compileOnly 'org.eclipse.jdt:org.eclipse.jdt.ui:3.33.200'
    compileOnly 'org.eclipse.platform:org.eclipse.platform:4.34.0'

    implementation 'junit:junit:4.13.2'

    implementation 'org.slf4j:slf4j-api:2.0.16'
    // implementation 'ch.qos.logback:logback-core:1.3.14'
    // implementation 'ch.qos.logback:logback-classic:1.3.14'

    implementation 'commons-lang:commons-lang:2.6'
    implementation 'org.apache.commons:commons-text:1.13.1'
    implementation 'org.soot-oss:soot:4.6.0'
    implementation 'com.openai:openai-java:1.5.1'

    compileOnly files("../../local-deps/jdimodel.jar")
    implementation files("../../local-deps/belief-propagation-java.jar")

    implementation project(':microbat:sav.commons')
    implementation project(':microbat:microbat_instrumentator')
    implementation project(':microbat:mutation')
}

configurations.all {
    resolutionStrategy.dependencySubstitution {
        def os = System.getProperty("os.name").toLowerCase()
        if (os.contains("windows")) {
            substitute module('org.eclipse.platform:org.eclipse.swt.${osgi.platform}') using module("org.eclipse.platform:org.eclipse.swt.win32.win32.x86_64:3.114.0")
        }
        else if (os.contains("linux")) {
            substitute module('org.eclipse.platform:org.eclipse.swt.${osgi.platform}') using module("org.eclipse.platform:org.eclipse.swt.gtk.linux.x86_64:3.114.0")
        }
        else if (os.contains("mac")) {
            substitute module('org.eclipse.platform:org.eclipse.swt.${osgi.platform}') using module("org.eclipse.platform:org.eclipse.swt.cocoa.macosx.x86_64:3.114.0")
        }
    }
}

