plugins {
    id 'java'
}


repositories {
    mavenCentral()
}

sourceSets {
    main {
        java {
            srcDirs += 'src/main'
            srcDirs += 'src/test/java'
        }
    }
}

dependencies {
    implementation 'org.slf4j:slf4j-api:2.0.16'
    implementation 'ch.qos.logback:logback-core:1.3.14'
    implementation 'ch.qos.logback:logback-classic:1.3.14'
    implementation 'commons-cli:commons-cli:1.2'
    implementation 'commons-io:commons-io:1.3.2'
    implementation 'org.apache.commons:commons-csv:1.0'
    implementation 'commons-lang:commons-lang:2.6'

    implementation 'junit:junit:4.13.2'

    implementation 'org.ow2.asm:asm:9.0'
    implementation 'org.apache.bcel:bcel:6.0'
    implementation 'org.benf:cfr:0.152'
    implementation 'com.ibm.wala:com.ibm.wala.core:1.3.9'
    implementation 'com.ibm.wala:com.ibm.wala.shrike:1.3.9'
    implementation 'com.ibm.wala:com.ibm.wala.util:1.3.9'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.github.javaparser:javaparser-core:3.26.2'
    implementation 'com.github.javaparser:javaparser-symbol-solver-core:3.26.2'
    implementation 'org.jgrapht:jgrapht-core:1.5.2'
    implementation 'org.jgrapht:jgrapht-io:1.5.2'
    implementation 'org.jheaps:jheaps:0.14'
    implementation 'org.json:json:20220924'
    implementation 'mysql:mysql-connector-java:5.1.44'
    implementation 'org.apache.poi:poi:3.11'
    implementation 'org.apache.poi:poi-ooxml:3.11'
    implementation 'org.apache.poi:poi-ooxml-schemas:3.11'
    implementation 'org.xerial:sqlite-jdbc:3.32.3.2'


    implementation 'org.eclipse.jdt:org.eclipse.jdt.core:3.40.0'
    implementation 'org.eclipse.platform:org.eclipse.platform:4.34.0'
    implementation 'org.eclipse.jdt:org.eclipse.jdt.debug:3.21.600'

    implementation files("../../local-deps/jdimodel.jar")
}


configurations.all {
    resolutionStrategy.dependencySubstitution {
        def os = System.getProperty("os.name").toLowerCase()
        if (os.contains("windows")) {
            substitute module('org.eclipse.platform:org.eclipse.swt.${osgi.platform}') using module("org.eclipse.platform:org.eclipse.swt.win32.win32.x86_64:3.114.0")
        }
        else if (os.contains("linux")) {
            substitute module('org.eclipse.platform:org.eclipse.swt.${osgi.platform}') using module("org.eclipse.platform:org.eclipse.swt.gtk.linux.x86_64:3.114.0")
        }
        else if (os.contains("mac")) {
            substitute module('org.eclipse.platform:org.eclipse.swt.${osgi.platform}') using module("org.eclipse.platform:org.eclipse.swt.cocoa.macosx.x86_64:3.114.0")
        }
    }
}

